openapi: 3.0.3
info:
  title: Employee Management API
  version: 1.0.0
  description: |
    PFEBSIT 002 - Integrative Programming 2, Module 1 (Weeks 1-6).
    Laravel 12 REST API with Eloquent relationships, pagination, search, filtering,
    and token-based authentication using Laravel Sanctum.

    **How to authorize:** call `POST /login` (or `/register`), copy the `token`,
    click **Authorize** and paste it.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local server (versioned)
  - url: http://127.0.0.1:8000/api
    description: Local server (unversioned, same endpoints)
tags:
  - name: Auth
  - name: Employees
  - name: Departments
security:
  - bearerAuth: []
paths:
  /register:
    post:
      tags: [Auth]
      summary: Register a new user and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
            example: { name: Admin User, email: admin@example.com, password: password123 }
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /login:
    post:
      tags: [Auth]
      summary: Log in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
            example: { email: admin@example.com, password: password123 }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Invalid login credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Invalid login credentials }
        '422': { $ref: '#/components/responses/ValidationError' }
  /user:
    get:
      tags: [Auth]
      summary: Get the currently logged-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Logged out successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /employees:
    get:
      tags: [Employees]
      summary: List employees (paginated, searchable, filterable)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 }, example: 1 }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: search, in: query, description: Searches first name, last name, and email, schema: { type: string }, example: juan }
        - { name: department_id, in: query, schema: { type: integer }, example: 1 }
        - { name: department, in: query, description: Department name, schema: { type: string }, example: IT }
      responses:
        '200':
          description: Paginated list of employees
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
            example:
              first_name: Juan
              last_name: Dela Cruz
              email: juan.delacruz@example.com
              department_id: 1
              position: Programmer
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    get:
      tags: [Employees]
      summary: Get one employee
      responses:
        '200':
          description: Employee found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/EmployeeNotFound' }
    put:
      tags: [Employees]
      summary: Update an employee (any subset of fields)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdateInput' }
            example: { position: Senior Programmer }
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Employee' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/EmployeeNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Employees]
      summary: Partially update an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeUpdateInput' }
            example: { email: juan.new@example.com }
      responses:
        '200': { description: Employee updated }
        '404': { $ref: '#/components/responses/EmployeeNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Employees]
      summary: Delete an employee
      responses:
        '200':
          description: Employee deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
              example: { message: Employee deleted successfully }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/EmployeeNotFound' }
  /departments:
    get:
      tags: [Departments]
      summary: List departments with employee counts
      responses:
        '200':
          description: Departments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Department' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
            example: { name: Operations }
      responses:
        '201': { description: Department created }
        '422': { $ref: '#/components/responses/ValidationError' }
  /departments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer }, example: 1 }
    get:
      tags: [Departments]
      summary: Get a department with its employees
      responses:
        '200': { description: Department with employees }
        '404': { description: Department not found }
    put:
      tags: [Departments]
      summary: Rename a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '200': { description: Department updated }
        '404': { description: Department not found }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Departments]
      summary: Delete a department (its employees are deleted too)
      responses:
        '200': { description: Department deleted }
        '404': { description: Department not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token, e.g. `1|abc123...`
  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Unauthenticated. }
    EmployeeNotFound:
      description: Employee not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Employee not found }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
          example:
            message: The email field must be a valid email address.
            errors:
              email: [The email field must be a valid email address.]
  schemas:
    Message:
      type: object
      properties:
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Admin User }
        email: { type: string, format: email, example: admin@example.com }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    AuthResponse:
      type: object
      properties:
        message: { type: string, example: Login successful }
        token: { type: string, example: 1|Xyz123abcDEF... }
        token_type: { type: string, example: Bearer }
        user: { $ref: '#/components/schemas/User' }
    Department:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: IT }
        employees_count: { type: integer, example: 8 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DepartmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
    Employee:
      type: object
      properties:
        id: { type: integer, example: 1 }
        first_name: { type: string, example: Juan }
        last_name: { type: string, example: Dela Cruz }
        full_name: { type: string, example: Juan Dela Cruz }
        email: { type: string, format: email, example: juan@example.com }
        department_id: { type: integer, example: 1 }
        department:
          type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: IT }
        position: { type: string, example: Programmer }
        created_at: { type: string, format: date-time, example: '2026-08-04T10:00:00.000000Z' }
        updated_at: { type: string, format: date-time, example: '2026-08-04T10:00:00.000000Z' }
    EmployeeInput:
      type: object
      required: [first_name, last_name, email, department_id, position]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        department_id: { type: integer, description: Must exist in departments }
        position: { type: string, maxLength: 100 }
    EmployeeUpdateInput:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        department_id: { type: integer }
        position: { type: string, maxLength: 100 }
    EmployeePage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        links:
          type: object
          properties:
            first: { type: string }
            last: { type: string }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer, example: 1 }
            last_page: { type: integer, example: 3 }
            per_page: { type: integer, example: 10 }
            total: { type: integer, example: 25 }
            from: { type: integer, example: 1 }
            to: { type: integer, example: 10 }
